server {
    listen 192.168.1.138:80;
    server_name 192.168.1.138;
    listen 80;             # Container escuta em todas as suas interfaces internas
    server_name 192.168.1.138; # IP do host de produção (para roteamento correto)

    # ==========================================
    # REGRA DE ACESSO RESTRITA (PRODUÇÃO)
    # ==========================================
    allow 192.168.1.0/24;  # Permite a rede interna Wi-Fi do escritório/casa
    allow 127.0.0.1;       # Permite o próprio servidor
    # allow 200.123.45.67; # IPs externos permitidos que você definir
    deny all;              # Bloqueia rigidamente todo o resto da internet

    # Servir a pasta web/
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Encaminha para o container Go de produção
    location /html/sessoes {
        proxy_pass http://host.docker.internal:8083; # Porta exposta no host pelo planner
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
