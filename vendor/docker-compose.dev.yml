services:
  nginx-server:
    image: nginx:alpine
    container_name: nginx-porteiro-dev
    restart: always
    ports:
      - "80:80" 
    volumes:
      - ./web:/usr/share/nginx/html
      # Carrega o arquivo específico de desenvolvimento
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ephemeris-network

  nats:
    image: nats:latest
    container_name: nats-dev
    restart: always
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - ephemeris-network

networks:
  ephemeris-network:
    name: ephemeris-network
