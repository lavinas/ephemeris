services:
  # Database service
  accounting_db:
    image: postgres:latest
    container_name: accounting_db_dev
    restart: always
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=accounting
      - PGDATA=/var/lib/postgresql/data
    networks:
      - net-accounting-dev
    ports:
      - "5435:5432"
    volumes:
      - ./.db:/var/lib/postgresql
      - ./migration/banking.sql:/docker-entrypoint-initdb.d/01_banking.sql:ro

  # API service
  accounting_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: accounting_api_dev
    restart: always
    ports:
      - "8084:8084"
    volumes:
      - ${PWD}:/app
    networks:
      - net-accounting-dev
      - ephemeris-network
    environment:
      - DB_HOST=accounting_db
      - DB_PORT=5432
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=accounting
    depends_on:
      - accounting_db

networks:
  net-accounting-dev:
    driver: bridge
  ephemeris-network:
    external: true

