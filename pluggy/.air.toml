root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/server/main.go"
  delay = 1000
  entrypoint = ["./tmp/main"]
  exclude_dir = ["tmp", "vendor", "bin"]
  exclude_file = ["go.mod", "go.sum"]
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  include_ext = ["go", "html", "yaml", "sql"]
  kill_delay = 500
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true

