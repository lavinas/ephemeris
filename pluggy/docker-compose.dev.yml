services:
  pluggy_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: pluggy_api_dev
    restart: always
    ports:
      - "8085:8085"
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - net-accounting-dev
      - ephemeris-network
    environment:
      - SERVER_PORT=8085
      - DB_HOST=accounting_db
      - DB_PORT=5432
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=pluggy
      - DB_SSLMODE=disable
      - PLUGGY_CLIENT_ID=1fe09f72-ca31-4139-904b-5fa9172767ce
      - PLUGGY_CLIENT_SECRET=VzBM_pWK1Z7hPtqu_SYfiXJoAhvIS4Cw0xZ1c5kSX1I
      - PLUGGY_BASE_URL=https://api.pluggy.ai

networks:
  net-accounting-dev:
    name: accounting_net-accounting-dev
    external: true
  ephemeris-network:
    external: true

