{{if not .}}
    <p>Nenhuma aula agendada no momento.</p>
{{else}}
    <table class="striped">
        <thead>
            <tr>
                <th>Aluno</th>
                <th>Data/Hora</th>
                <th>Estilo</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {{range .}}
            <tr>
                <td>
                    <strong>{{.Aluno}}</strong><br>
                    <small style="color: #666;">{{.Descricao}}</small>
                </td>
                <td>{{.DataHora}}</td>
                <td><mark>{{.Estilo}}</mark></td>
                <td>
                    <div role="group">
                        <button class="outline contrast" 
                                style="padding: 2px 8px; font-size: 0.8rem;" 
                                hx-get="/aulas/editar?id={{.ID}}" 
                                hx-target="#formulario-container">
                            Editar
                        </button>
                        <button class="outline secondary" 
                                style="padding: 2px 8px; font-size: 0.8rem;" 
                                hx-delete="/aulas/deletar?id={{.ID}}"
                                hx-confirm="Tem certeza que deseja desmarcar esta aula?"
                                hx-target="this">
                            Excluir
                        </button>
                    </div>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
{{end}}
