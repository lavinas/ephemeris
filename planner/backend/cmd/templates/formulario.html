<form hx-post="/aulas/salvar" hx-target="#feedback" hx-swap="innerHTML">
    <input type="hidden" name="id" value="{{.ID}}">

    <label for="aluno">Nome do Aluno
        <input type="text" id="aluno" name="aluno" value="{{.Aluno}}" placeholder="Ex: Ana Clara" required>
    </label>

    <div class="grid">
        <label for="data_hora">Data e Horário
            <input type="datetime-local" id="data_hora" name="data_hora" value="{{.DataHora}}" required>
        </label>
        
        <label for="estilo">Estilo Musical
            <select id="estilo" name="estilo">
                <option value="Pop" {{if eq .Estilo "Pop"}}selected{{end}}>Pop</option>
                <option value="Rock" {{if eq .Estilo "Rock"}}selected{{end}}>Rock</option>
                <option value="Lírico" {{if eq .Estilo "Lírico"}}selected{{end}}>Lírico</option>
                <option value="Sertanejo" {{if eq .Estilo "Sertanejo"}}selected{{end}}>Sertanejo</option>
                <option value="Jazz/Blues" {{if eq .Estilo "Jazz/Blues"}}selected{{end}}>Jazz/Blues</option>
            </select>
        </label>
    </div>

    <label for="descricao">Foco Pedagógico / Descrição
        <textarea id="descricao" name="descricao" placeholder="Ex: Respiração diafragmática, vocalizes de aquecimento..." rows="3">{{.Descricao}}</textarea>
    </label>

    <div class="grid">
        <button type="submit" class="primary">Salvar Aula</button>
        {{if .ID}}
            <button type="button" class="secondary outline" hx-get="/aulas/novo" hx-target="#formulario-container">Cancelar</button>
        {{end}}
    </div>
</form>
