<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador - Aulas de Canto</title>
    <!-- Pico.css para um visual limpo e moderno sem complicação -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Script do HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .layout-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 2rem; }
        @media (max-width: 768px) { .layout-grid { grid-template-columns: 1fr; } }
        .alert { padding: 0.5rem 1rem; border-radius: 4px; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li><strong>🎤 Escola de Canto - Painel Técnico</strong></li>
            </ul>
            <ul>
                <li><button class="outline" hx-get="/aulas/novo" hx-target="#formulario-container">Nova Aula</button></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="layout-grid">
            <!-- Coluna do Formulário -->
            <section>
                <h3>Gerenciar Aula</h3>
                <div id="feedback"></div>
                <div id="formulario-container" hx-get="/aulas/novo" hx-trigger="load">
                    <!-- O formulário será carregado aqui via HTMX -->
                </div>
            </section>

            <!-- Coluna da Listagem -->
            <section>
                <h3>Próximas Aulas Agendadas</h3>
                <!-- Atualiza automaticamente ao carregar e sempre que o evento "atualizarLista" for disparado do backend -->
                <div id="lista-container" hx-get="/aulas" hx-trigger="load, atualizarLista from:body">
                    <!-- A lista será carregada aqui -->
                </div>
            </section>
        </div>
    </main>
</body>
</html>
