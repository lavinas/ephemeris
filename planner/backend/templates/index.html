<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Sessões | ClassFlow</title>
    <!-- Tailwind CSS CDN para Design Moderno e Fluido -->
    <script src="https://tailwindcss.com"></script>
    <!-- HTMX Carregado Localmente -->
    <script src="/static/htmx.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- BARRA DE NAVEGAÇÃO SUPERIOR -->
    <nav class="bg-white border-b border-slate-200/80 sticky top-0 z-40 backdrop-blur-md bg-white/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md shadow-indigo-200">
                        <svg xmlns="http://w3.org" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.783 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-slate-900">Class<span class="text-indigo-600">Flow</span></span>
                </div>
                
                <!-- BOTÃO PRINCIPAL: ABRE O POP-UP (MODAL) -->
                <button onclick="toggleModal(true)" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-5 rounded-xl transition-all hover:shadow-lg hover:shadow-indigo-100 active:scale-95 text-sm">
                    <svg xmlns="http://w3.org" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    Nova Sessão
                </button>
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL (DASHBOARD) -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- PAINEL DE FILTROS AVANÇADOS -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/60 mb-8">
            <div class="flex items-center gap-2 mb-4 border-b border-slate-100 pb-3">
                <span class="text-lg">🔍</span>
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Filtros Dinâmicos</h2>
            </div>
            
            <form hx-get="/sessions/search" 
                  hx-target="#table-body" 
                  hx-swap="innerHTML"
                  hx-trigger="change, keyup delay:300ms from:input[name='nickname']"
                  class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">Filtro por Nickname</label>
                    <input type="text" name="nickname" placeholder="Ex: Arthur..." class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-slate-400">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">Status da Sessão</label>
                    <select name="status_selection" class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all bg-white">
                        <option value="">Todos os Status</option>
                        <option value="realizada">Realizada</option>
                        <option value="cancelada_cobrar">Cancelada (Cobrar)</option>
                        <option value="cancelada_nao_cobrar">Cancelada (Não Cobrar)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">Minutos Exatos</label>
                    <input type="number" name="minutes" placeholder="Ex: 60" class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-slate-400">
                </div>

                <div class="md:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-6 border-t border-slate-100 pt-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1.5">Período de (Data Início)</label>
                        <input type="date" name="date_start" class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-slate-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1.5">Período até (Data Fim)</label>
                        <input type="date" name="date_end" class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-slate-500">
                    </div>
                </div>
            </form>
        </div>

        <!-- LISTAGEM EM TABELA ESTILIZADA -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/70 border-b border-slate-200/80 text-xs font-bold uppercase tracking-wider text-slate-400">
                            <th class="px-6 py-4">Nickname Cliente</th>
                            <th class="px-6 py-4">Data da Aula</th>
                            <th class="px-6 py-4">Duração</th>
                            <th class="px-6 py-4">Status Atual</th>
                            <th class="px-6 py-4">Comentários Adicionais</th>
                            <th class="px-6 py-4 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100">
                        <!-- O Go renderiza inicialmente o partial 'table-rows' aqui dentro -->
                        {{template "table-rows" .}}
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- POP-UP (MODAL) FORMULÁRIO DE CRIAÇÃO -->
    <div id="session-modal" class="fixed inset-0 z-50 overflow-y-auto hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end sm:items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            
            <!-- Overlay escuro de fundo com desfoque de vidro -->
            <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="toggleModal(false)"></div>

            <!-- Alinhador vertical para centralizar o modal na tela -->
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <!-- Caixa Estrutural do Modal -->
            <div class="inline-block align-bottom bg-white rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full border border-slate-100">
                <div class="bg-white px-6 pt-6 pb-4 sm:p-6 sm:pb-4">
                    
                    <!-- Cabeçalho do Pop-up -->
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-5">
                        <h3 class="text-xl font-bold text-slate-900" id="modal-title">Agendar Nova Sessão</h3>
                        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 transition-colors p-1.5 rounded-lg hover:bg-slate-50">
                            <svg xmlns="http://w3.org" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>

                    <!-- FORMULÁRIO HTMX -->
                    <form hx-post="/sessions" 
                          hx-target="#table-body" 
                          hx-swap="innerHTML"
                          hx-on::after-request="if(event.detail.successful) { toggleModal(false); this.reset(); }"
                          class="space-y-5">
                        
                        <!-- Campo: Nickname -->
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Nickname do Cliente</label>
                            <input type="text" name="nickname" required placeholder="Ex: mateus_dev" class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                        </div>

                        <!-- Campo: Status Inicial -->
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Status Inicial</label>
                            <select name="status_selection" class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all bg-white">
                                <option value="realizada">Realizada ✅</option>
                                <option value="cancelada_cobrar">Cancelada (Cobrar) ⚠️</option>
                                <option value="cancelada_nao_cobrar">Cancelada (Não Cobrar) ❌</option>
                            </select>
                        </div>

                        <!-- Campo: Comentários -->
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Comentários da Sessão</label>
                            <textarea name="comments" rows="3" placeholder="Observações e pauta da reunião acadêmica..." class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"></textarea>
                        </div>

                        <!-- Grid: Data e Duração -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Data</label>
                                <input type="date" name="date" required class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-slate-600">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Duração (Minutos)</label>
                                <input type="number" name="minutes" required min="1" placeholder="60" class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                            </div>
                        </div> <!-- O código acima entra exatamente AQUI, logo após o fechamento desta div -->
                        
                        <!-- Campo: Status Inicial -->
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Status Inicial</label>
                            <select name="status_selection" class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all bg-white">
                                <option value="realizada">Realizada ✅</option>
                                <option value="cancelada_cobrar">Cancelada (Cobrar) ⚠️</option>
                                <option value="cancelada_nao_cobrar">Cancelada (Não Cobrar) ❌</option>
                            </select>
                        </div>

                        <!-- Campo: Comentários da Sessão -->
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Comentários da Sessão</label>
                            <textarea name="comments" rows="3" placeholder="Observações e pauta da reunião acadêmica..." class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"></textarea>
                        </div>

                        <!-- Botões de Ação do Pop-up -->
                        <div class="border-t border-slate-100 pt-4 flex gap-3 justify-end">
                            <button type="button" onclick="toggleModal(false)" class="px-5 py-2.5 text-sm font-semibold text-slate-500 hover:bg-slate-50 rounded-xl border border-slate-200 transition-all">
                                Cancelar
                            </button>
                            <button type="submit" class="px-5 py-2.5 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition-all shadow-md shadow-indigo-100">
                                Salvar Sessão
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE CONTROLE JAVASCRIPT DO POP-UP -->
    <script>
        function toggleModal(show) {
            const modal = document.getElementById('session-modal');
            if (show) {
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Bloqueia o scroll da tela de fundo ao abrir o modal
            } else {
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto'; // Restaura o scroll da tela de fundo ao fechar
            }
        }
    </script>
</body>
</html>
