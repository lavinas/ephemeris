services:
  # Database service
  planner_db:
    image: postgres:latest
    container_name: planner_db_prod
    restart: always
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=planner
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - net-planner-prod
    ports:
      # Aberto globalmente para que as outras 2 máquinas da sua rede interna 
      # acessem o banco diretamente via DBeaver/pgAdmin
      - "5433:5432"
    volumes:
      # SOLUÇÃO 1: Trocado de ./.db para um volume nomeado gerenciado pelo Docker.
      # Isso resolve definitivamente o erro de 'Permission Denied'.
      - pg_production_data:/var/lib/postgresql/data

  # API service
  planner_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: planner_api_prod
    restart: always
    networks:
      - net-planner-prod
    ports:
      # Porta 8083 aberta globalmente para que qualquer máquina da rede
      # acesse o app digitando http://IP-DO-UBUNTU:8083 no navegador
      - "8083:8083"
    # Sem blocos de 'environment' ou 'volumes', lendo seu arquivo interno de config
    depends_on:
      - planner_db

# ADICIONADO: Declaração obrigatória do volume nomeado que o Docker vai gerenciar
volumes:
  pg_production_data:

networks:
  net-planner-prod:
    driver: bridge

