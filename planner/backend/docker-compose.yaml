services:
  # Database service
  planner_db:
    image: postgres:latest
    container_name: planner_db
    restart: always
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=planner
      - PGDATA=/var/lib/postgresql/data
    networks:
      - net-planner
    ports:
      - "5433:5432"
    volumes:
      - ./.db:/var/lib/postgresql
  # API service
  planner_api:
      build: .
      container_name: planner_api
      restart: always
      networks:
        - net-planner
      ports:
        - "8083:8083"
      volumes:
        - ${PWD}:/app
      environment:
        - DB_HOST=planner_db
        - DB_PORT=5433
        - DB_USER=root
        - DB_PASSWORD=root
        - DB_NAME=planner
      depends_on:
        - planner_db
networks:
  net-planner:
    driver: bridge
