<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ephemeris</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			background-color: #000000;
			color: #f3f4f6;
		}

		.layout-container {
			display: flex;
			flex-direction: row;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
		}

		/* Menu lateral esquerdo (contendo logo e links) */
		.sidebar {
			width: 220px;
			min-width: 220px;
			height: 100vh;
			background-color: #000000;
			border-right: 1px solid #1f2937;
			display: flex;
			flex-direction: column;
			padding: 8px 12px 20px;
			box-sizing: border-box;
		}

		.sidebar-logo {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0 8px 16px;
			border-bottom: 1px solid #1f2937;
			margin-bottom: 16px;
		}

		.sidebar-logo .logo {
			max-width: 100%;
			height: 66px;
			max-height: 70px;
			object-fit: contain;
			display: block;
		}

		.menu-nav {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.menu-link {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 10px 16px;
			color: #9ca3af;
			text-decoration: none;
			border-radius: 8px;
			font-size: 14px;
			font-weight: 500;
			transition: background-color 0.15s ease, color 0.15s ease;
		}

		.menu-link:hover {
			background-color: #111827;
			color: #ffffff;
		}

		.menu-link.active {
			background-color: #1f2937;
			color: #ffffff;
			font-weight: 600;
		}

		.menu-link svg {
			width: 18px;
			height: 18px;
			flex-shrink: 0;
		}

		/* Container do subframe - inicia diretamente no topo */
		.content-frame-container {
			flex: 1;
			height: 100vh;
			background-color: #ffffff;
			position: relative;
			overflow: hidden;
		}

		.content-frame {
			width: 100%;
			height: 100%;
			border: none;
			display: block;
			background-color: #ffffff;
		}
	</style>
</head>
<body>
	<div class="layout-container">
		<!-- Menu Lateral: Logo e Navegação -->
		<aside class="sidebar">
			<div class="sidebar-logo">
				<img src="/static/logo.png" alt="Logo" class="logo" onerror="this.style.display='none';">
			</div>
			<nav class="menu-nav">
				<a href="/html/sessoes" target="subframe-conteudo" class="menu-link active">
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
						<path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.253M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
					</svg>
					<span>Sessões</span>
				</a>
				<a href="/html/planos" target="subframe-conteudo" class="menu-link">
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
						<path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z" />
					</svg>
					<span>Planos</span>
				</a>
			</nav>
		</aside>

		<!-- Subframe: Inicia no topo sem barra superior -->
		<main class="content-frame-container">
			<iframe 
				id="subframe-conteudo" 
				name="subframe-conteudo" 
				src="/html/sessoes" 
				class="content-frame" 
				title="Conteúdo das Sessões">
			</iframe>
		</main>
	</div>

	<script>
		// Gerenciamento de links ativos no menu
		document.querySelectorAll('.menu-link').forEach(link => {
			link.addEventListener('click', function() {
				document.querySelectorAll('.menu-link').forEach(l => l.classList.remove('active'));
				this.classList.add('active');
			});
		});
	</script>
</body>
</html>
