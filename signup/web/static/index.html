<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ephemeris - Signup</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			background-color: #000000;
			color: #f3f4f6;
		}

		.layout-container {
			display: flex;
			flex-direction: row;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
		}

		/* Menu lateral esquerdo (contendo logo e links) */
		.sidebar {
			width: 220px;
			min-width: 220px;
			height: 100vh;
			background-color: #000000;
			border-right: 1px solid #1f2937;
			display: flex;
			flex-direction: column;
			padding: 8px 12px 20px;
			box-sizing: border-box;
		}

		.sidebar-logo {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0 8px 16px;
			border-bottom: 1px solid #1f2937;
			margin-bottom: 16px;
		}

		.sidebar-logo .logo {
			max-width: 100%;
			height: 66px;
			max-height: 70px;
			object-fit: contain;
			display: block;
		}

		.menu-nav {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.menu-link {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 10px 16px;
			color: #9ca3af;
			text-decoration: none;
			border-radius: 8px;
			font-size: 14px;
			font-weight: 500;
			transition: background-color 0.15s ease, color 0.15s ease;
		}

		.menu-link:hover {
			background-color: #111827;
			color: #ffffff;
		}

		.menu-link.active {
			background-color: #1f2937;
			color: #ffffff;
			font-weight: 600;
		}

		.menu-link svg {
			width: 18px;
			height: 18px;
			flex-shrink: 0;
		}

		/* Container do subframe - inicia diretamente no topo */
		.content-frame-container {
			flex: 1;
			height: 100vh;
			background-color: #ffffff;
			position: relative;
			overflow: hidden;
		}

		.content-frame {
			width: 100%;
			height: 100%;
			border: none;
			display: block;
			background-color: #ffffff;
		}
	</style>
</head>
<body>
	<div class="layout-container">
		<!-- Menu Lateral: Logo e Navegação -->
		<aside class="sidebar">
			<div class="sidebar-logo">
				<img src="/static/logo.png" alt="Logo" class="logo" onerror="this.style.display='none';">
			</div>
			<nav class="menu-nav">
				<a href="/html/customers" target="subframe-conteudo" class="menu-link active">
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
						<path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
					</svg>
					<span>Clientes</span>
				</a>
				<a href="/html/users" target="subframe-conteudo" class="menu-link">
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
						<path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
					</svg>
					<span>Usuários</span>
				</a>
			</nav>
		</aside>

		<!-- Subframe: Inicia no topo sem barra superior -->
		<main class="content-frame-container">
			<iframe 
				id="subframe-conteudo" 
				name="subframe-conteudo" 
				src="/html/customers" 
				class="content-frame" 
				title="Conteúdo">
			</iframe>
		</main>
	</div>

	<script>
		// Gerenciamento de links ativos no menu
		document.querySelectorAll('.menu-link').forEach(link => {
			link.addEventListener('click', function() {
				document.querySelectorAll('.menu-link').forEach(l => l.classList.remove('active'));
				this.classList.add('active');
			});
		});
	</script>
</body>
</html>
