services:
  # Database service
  signup_db:
    image: postgres:latest
    container_name: signup_db_prod
    restart: always
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=signup
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - net-signup-prod
    ports:
      - "5433:5432"
    volumes:
      - pg_production_data:/var/lib/postgresql/data

  # API service
  signup_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: signup_api_prod
    restart: always
    networks:
      - net-signup-prod
    ports:
      - "8082:8082"
    volumes:
      # ADICIONADO: Sincroniza a pasta de logs local com a interna do container
      - ./log:/app/log
    depends_on:
      - signup_db

volumes:
  pg_production_data:

networks:
  net-signup-prod:
    driver: bridge
